<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script>if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark');</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <script>
    tailwind.config = {
      darkMode:'class',
      theme:{ extend:{ colors:{ primary:"#137fec" }, fontFamily:{ display:["Lexend"] } } }
    }
  </script>
  <title>Reserved Classes — NIE ClassPulse</title>
  <style>
    body { font-family:'Lexend',sans-serif; }
    .loader { width:36px;height:36px;border:4px solid #e2e8f0;border-top-color:#137fec;border-radius:50%;animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 min-h-screen text-slate-900 dark:text-slate-100 transition-colors">

<!-- Header -->
<header class="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
  <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
    <a href="/" class="flex items-center gap-2.5">
      <img src="/logo.png" alt="NIE ClassPulse" class="h-9 w-9 rounded-xl object-cover"
           onerror="this.style.display='none';document.getElementById('logo-fallback').style.display='flex'"/>
      <div id="logo-fallback" style="display:none" class="bg-primary p-1.5 rounded-lg text-white">
        <span class="material-symbols-outlined text-sm">pulse_alert</span>
      </div>
      <span class="font-bold text-lg">NIE ClassPulse</span>
    </a>
    <div class="flex items-center gap-2">
      <!-- Pre-Book button — only shown when logged in -->
      <a id="prebook-nav-btn" href="/pages/prebook.html" style="display:none"
         class="flex items-center gap-1.5 bg-primary text-white text-sm font-semibold px-3 py-2 rounded-lg hover:bg-primary/90 transition-colors">
        <span class="material-symbols-outlined text-base">add_circle</span>
        <span class="hidden sm:inline">Pre-Book a Class</span>
      </a>
      <button onclick="toggleTheme()"
              class="size-9 flex items-center justify-center rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
        <span id="theme-icon" class="material-symbols-outlined text-slate-600 dark:text-slate-300 text-xl">dark_mode</span>
      </button>
    </div>
  </div>
</header>

<main class="max-w-5xl mx-auto px-4 py-8 pb-24">

  <!-- Page title -->
  <div class="flex items-center gap-3 mb-6">
    <span class="material-symbols-outlined text-primary text-2xl">event_available</span>
    <div>
      <h1 class="text-2xl font-bold">Reserved Classes</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400">Upcoming pre-booked classrooms</p>
    </div>
  </div>

  <!-- Loading -->
  <div id="loading" class="flex justify-center py-20">
    <div class="loader"></div>
  </div>

  <!-- Empty state -->
  <div id="empty-state" class="hidden text-center py-20">
    <span class="material-symbols-outlined text-5xl text-slate-300 dark:text-slate-700 block mb-3">event_busy</span>
    <p class="font-medium text-slate-500">No upcoming reservations</p>
    <p class="text-sm text-slate-400 mt-1">No classrooms have been pre-booked yet.</p>
  </div>

  <!-- Bookings grid -->
  <div id="bookings-grid" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

</main>

<script>
function toggleTheme() {
  const isDark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
  document.getElementById('theme-icon').textContent = isDark ? 'light_mode' : 'dark_mode';
}
window.addEventListener('DOMContentLoaded', () => {
  const isDark = document.documentElement.classList.contains('dark');
  document.getElementById('theme-icon').textContent = isDark ? 'light_mode' : 'dark_mode';
});
</script>

<script type="module">
  import { supabase } from '/js/supabase.js';
  import { getUser, getDisplayEmail } from '/js/auth.js';

  const user = await getUser();
  if (user) {
    const preBookBtn = document.getElementById('prebook-nav-btn');
    if (preBookBtn) preBookBtn.style.display = 'flex';
  }

  await loadBookings(user);

  async function loadBookings(user) {
    try {
      const now = new Date();
      const todayIST = new Date(now.getTime() + (5.5 * 60 * 60 * 1000));
      const todayStr = todayIST.toISOString().split('T')[0];

      const { data, error } = await supabase
        .from('bookings')
        .select('*')
        .gte('date', todayStr)
        .order('date', { ascending: true })
        .order('start_time', { ascending: true });

      if (error) throw error;

      // Filter out expired bookings (past end time today)
      const nowTimeStr = todayIST.toTimeString().substring(0, 5);
      const active = data.filter(b => {
        if (b.date > todayStr) return true;
        return b.end_time.substring(0,5) > nowTimeStr;
      });

      document.getElementById('loading').classList.add('hidden');

      if (!active.length) {
        document.getElementById('empty-state').classList.remove('hidden');
        return;
      }

      const grid = document.getElementById('bookings-grid');
      grid.classList.remove('hidden');
      grid.innerHTML = active.map(b => buildCard(b, user)).join('');

      // Bind cancel buttons
      grid.querySelectorAll('.cancel-btn').forEach(btn => {
        btn.addEventListener('click', () => cancelBooking(btn.dataset.id));
      });

    } catch (err) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('empty-state').classList.remove('hidden');
    }
  }

  function buildCard(b, user) {
    const isStaff = !!user;
    const dateLabel = formatDate(b.date);
    const start = fmtTime(b.start_time);
    const end   = fmtTime(b.end_time);

    return `
      <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 overflow-hidden shadow-sm">
        <div class="h-1.5 bg-primary"></div>
        <div class="p-4">
          <div class="flex justify-between items-start mb-3">
            <div>
              <h3 class="text-xl font-bold">${b.room_number}</h3>
              <p class="text-xs text-slate-500 dark:text-slate-400">${dateLabel}</p>
            </div>
            <span class="bg-primary/10 text-primary text-xs font-bold px-2 py-1 rounded-lg">Reserved</span>
          </div>
          <div class="space-y-1.5 mb-4">
            <div class="flex items-center gap-2 text-sm text-slate-600 dark:text-slate-300">
              <span class="material-symbols-outlined text-base text-slate-400">schedule</span>
              <span>${start} – ${end}</span>
            </div>
            <div class="flex items-center gap-2 text-sm text-slate-600 dark:text-slate-300">
              <span class="material-symbols-outlined text-base text-slate-400">book</span>
              <span>${b.subject}</span>
            </div>
            ${b.faculty ? `<div class="flex items-center gap-2 text-sm text-slate-600 dark:text-slate-300">
              <span class="material-symbols-outlined text-base text-slate-400">person</span>
              <span>${b.faculty}</span>
            </div>` : ''}
            <div class="flex items-center gap-2 text-sm text-slate-400">
              <span class="material-symbols-outlined text-base">mail</span>
              <span class="truncate">${b.booked_by}</span>
            </div>
          </div>
          ${isStaff ? `
          <div class="pt-3 border-t border-slate-100 dark:border-slate-800">
            <button class="cancel-btn w-full flex items-center justify-center gap-1.5 text-xs font-semibold text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 py-2 rounded-lg transition-colors" data-id="${b.id}">
              <span class="material-symbols-outlined text-sm">cancel</span>Cancel Booking
            </button>
          </div>` : ''}
        </div>
      </div>`;
  }

  async function cancelBooking(id) {
    if (!confirm('Cancel this booking?')) return;
    const { error } = await supabase.from('bookings').delete().eq('id', id);
    if (error) { alert('Error: ' + error.message); return; }
    const user = await getUser();
    await loadBookings(user);
  }

  function formatDate(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('en-IN', { weekday:'short', day:'numeric', month:'short' });
  }

  function fmtTime(t) {
    if (!t) return '';
    const [h, m] = t.substring(0,5).split(':').map(Number);
    return `${h > 12 ? h-12 : h === 0 ? 12 : h}:${String(m).padStart(2,'0')} ${h >= 12 ? 'PM':'AM'}`;
  }
</script>
<script src="/js/chaos-bg.js?v=6.0"></script>
</body>
</html>
